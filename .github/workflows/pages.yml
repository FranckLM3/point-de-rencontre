name: pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 3'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la configuration
        env:
          URL: ${{ vars.SUPABASE_URL }}
          CLE: ${{ vars.SUPABASE_ANON_KEY }}
          EMAIL: ${{ vars.COMPTE_EMAIL }}
        run: |
          for v in URL CLE EMAIL; do
            if [ -z "${!v}" ]; then echo "Variable de dépôt manquante ($v) : voir le README, section Publier."; exit 1; fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Parcours dans le navigateur (Supabase simulé)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests des horaires
        run: npm run test:horaires
      - name: Version des horaires
        id: version
        run: |
          mkdir -p .cache-horaires
          empreinte=$(sha256sum horaires/*.py public/data/grille-4km.json | sha256sum | cut -c1-12)
          echo "empreinte=$empreinte" >> "$GITHUB_OUTPUT"
          url=$(python3 -m horaires --url)
          if curl -sfL --retry 3 --retry-delay 10 -o .cache-horaires/sncf.zip "$url"; then
            v=$(python3 -c "import csv, io, zipfile; f = zipfile.ZipFile('.cache-horaires/sncf.zip').open('feed_info.txt'); print(next(csv.DictReader(io.TextIOWrapper(f, 'utf-8-sig')))['feed_version'])")
            echo "telecharge=true" >> "$GITHUB_OUTPUT"
            echo "cle=horaires-$empreinte-$v" >> "$GITHUB_OUTPUT"
          else
            echo "telecharge=false" >> "$GITHUB_OUTPUT"
            echo "cle=horaires-$empreinte-indisponible" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache des horaires
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: public/data/tc
          key: ${{ steps.version.outputs.cle }}
          # Seul un cache produit par le même code et la même grille peut servir de repli.
          restore-keys: horaires-${{ steps.version.outputs.empreinte }}-
      - name: Horaires SNCF indisponibles
        if: steps.version.outputs.telecharge != 'true'
        env:
          RESTAURE: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          if [ -z "$RESTAURE" ]; then echo "::error::Téléchargement des horaires SNCF en échec et aucun cache à reprendre."; exit 1; fi
          echo "::warning::Téléchargement des horaires SNCF en échec : publication avec le cache $RESTAURE."
      - name: Calculer les horaires
        id: calcul
        if: steps.version.outputs.telecharge == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: python3 -m horaires --sortie public/data/tc --source .cache-horaires/sncf.zip
      - name: Garder les horaires en cache
        if: steps.calcul.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: public/data/tc
          key: ${{ steps.version.outputs.cle }}
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_COMPTE_EMAIL: ${{ vars.COMPTE_EMAIL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
