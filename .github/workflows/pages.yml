name: pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 3'
  workflow_dispatch:
    inputs:
      rafraichir_horaires:
        description: Recalculer les horaires SNCF même si un calcul est en réserve
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la configuration
        env:
          URL: ${{ vars.SUPABASE_URL }}
          CLE: ${{ vars.SUPABASE_ANON_KEY }}
          EMAIL: ${{ vars.COMPTE_EMAIL }}
        run: |
          for v in URL CLE EMAIL; do
            if [ -z "${!v}" ]; then echo "Variable de dépôt manquante ($v) : voir le README, section Publier."; exit 1; fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Parcours dans le navigateur (Supabase simulé)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests des horaires
        run: npm run test:horaires
      # Horaires SNCF : la publication réutilise le dernier calcul fait avec le même code
      # (quelques minutes). Le calcul complet (40 à 50 min) ne tourne que si le code du
      # calcul ou la grille a changé, ou lors du rafraîchissement hebdomadaire (cron), ou
      # sur demande (workflow_dispatch avec rafraichir_horaires).
      - name: Empreinte du calcul
        id: empreinte
        run: |
          # Liste explicite (même ordre que l'ancien horaires/*.py) : urbain.py a sa propre réserve.
          fichiers="horaires/__init__.py horaires/__main__.py horaires/geo.py horaires/gtfs.py horaires/parcours.py horaires/rails.py horaires/sortie.py"
          echo "valeur=$(sha256sum $fichiers public/data/grille-4km.json | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Dernier calcul en réserve
        id: reserve
        uses: actions/cache/restore@v4
        with:
          path: public/data/tc
          key: horaires-${{ steps.empreinte.outputs.valeur }}-aucune-cle-exacte
          restore-keys: horaires-${{ steps.empreinte.outputs.valeur }}-
      - name: Faut-il recalculer les horaires ?
        id: besoin
        env:
          EVENEMENT: ${{ github.event_name }}
          DEMANDE: ${{ github.event.inputs.rafraichir_horaires }}
          RESERVE: ${{ steps.reserve.outputs.cache-matched-key }}
        run: |
          if [ -z "$RESERVE" ] || [ "$EVENEMENT" = "schedule" ] || [ "$DEMANDE" = "true" ]; then
            echo "calculer=true" >> "$GITHUB_OUTPUT"
          else
            echo "calculer=false" >> "$GITHUB_OUTPUT"
            echo "Horaires repris du calcul en réserve $RESERVE."
          fi
      - name: Télécharger les horaires et les rails
        id: version
        if: steps.besoin.outputs.calculer == 'true'
        env:
          EMPREINTE: ${{ steps.empreinte.outputs.valeur }}
          RESERVE: ${{ steps.reserve.outputs.cache-matched-key }}
        run: |
          mkdir -p .cache-horaires
          url=$(python3 -m horaires --url)
          rails_url="https://ressources.data.sncf.com/api/explore/v2.1/catalog/datasets/formes-des-lignes-du-rfn/exports/geojson"
          if curl -sfL --retry 3 --retry-delay 10 -o .cache-horaires/sncf.zip "$url" \
             && curl -sfL --retry 3 --retry-delay 10 -o .cache-horaires/rails.geojson "$rails_url"; then
            v=$(python3 -c "import csv, io, zipfile; f = zipfile.ZipFile('.cache-horaires/sncf.zip').open('feed_info.txt'); print(next(csv.DictReader(io.TextIOWrapper(f, 'utf-8-sig')))['feed_version'])")
            rv=$(sha256sum .cache-horaires/rails.geojson | cut -c1-12)
            cle="horaires-$EMPREINTE-$v-$rv"
            echo "cle=$cle" >> "$GITHUB_OUTPUT"
            if [ "$cle" = "$RESERVE" ]; then
              echo "lancer=false" >> "$GITHUB_OUTPUT"
              echo "Horaires déjà à jour dans la réserve."
            else
              echo "lancer=true" >> "$GITHUB_OUTPUT"
            fi
          elif [ -n "$RESERVE" ]; then
            echo "lancer=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Téléchargement SNCF en échec, publication avec le calcul en réserve $RESERVE."
          else
            echo "::error::Téléchargement SNCF en échec et aucun calcul en réserve pour ce code."
            exit 1
          fi
      - name: Calculer les horaires
        id: calcul
        if: steps.version.outputs.lancer == 'true'
        run: python3 -m horaires --sortie public/data/tc --source .cache-horaires/sncf.zip --rails .cache-horaires/rails.geojson
      - name: Garder les horaires en réserve
        if: steps.calcul.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: public/data/tc
          key: ${{ steps.version.outputs.cle }}
      # Réseaux urbains (métro, RER, tram ; plan 4) : moins d'une minute de calcul, même principe
      # de réserve que les horaires SNCF. Sans réserve ni calcul réussi, la page est publiée sans
      # eux (règle voiture partout), avec un avertissement.
      - name: Empreinte des réseaux urbains
        id: empreinte_urbain
        run: |
          echo "valeur=$(sha256sum horaires/urbain.py horaires/gtfs.py horaires/geo.py | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Réseaux urbains en réserve
        id: reserve_urbain
        uses: actions/cache/restore@v4
        with:
          path: public/data/urbain
          key: urbain-${{ steps.empreinte_urbain.outputs.valeur }}-aucune-cle-exacte
          restore-keys: urbain-${{ steps.empreinte_urbain.outputs.valeur }}-
      - name: Calculer les réseaux urbains
        id: calcul_urbain
        if: steps.reserve_urbain.outputs.cache-matched-key == '' || github.event_name == 'schedule' || github.event.inputs.rafraichir_horaires == 'true'
        continue-on-error: true
        run: python3 -m horaires.urbain --sortie public/data/urbain
      - name: Garder les réseaux urbains en réserve
        if: steps.calcul_urbain.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: public/data/urbain
          key: urbain-${{ steps.empreinte_urbain.outputs.valeur }}-${{ github.run_id }}
      - name: Vérifier les réseaux urbains
        run: |
          if [ ! -f public/data/urbain/reseaux.json ]; then
            echo "::warning::Réseaux urbains indisponibles, publication sans eux (règle voiture partout)."
          fi
      - name: Prix du carburant
        run: |
          node scripts/carburant.mjs || echo "::warning::Téléchargement du prix des carburants en échec, fichier commité conservé (public/data/carburant.json)."
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_COMPTE_EMAIL: ${{ vars.COMPTE_EMAIL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
